name: Deploy to Vercel

on:
  workflow_dispatch: {} # deploy HANYA saat kamu klik tombol "Run workflow" di tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cuma generate Prisma Client dari schema.prisma yang sudah ada di repo.
      # TIDAK mengubah struktur database (aman, tidak menyentuh data).
      # Perubahan schema (db push) tetap dilakukan manual dari device kamu,
      # bukan otomatis lewat CI, karena database ini dipakai bersama app lain.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}